name: 打包扑克复盘台

permissions:
  contents: write      # 发 Release 需要写权限

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:        # 也可以手动点按钮触发

jobs:
  # ── Windows 版 ──────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 装依赖
        run: pip install pyinstaller numpy

      - name: 构建
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -X utf8 build_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
          if (-not (Test-Path "dist/扑克复盘台.exe")) { Write-Error "exe not found"; exit 1 }
          # 中文文件名在 Release 里会被吃成 default.exe；用 ASCII + 版本号，
          # 这样下载下来就知道是哪一版（v1.3 → pokercoach-v1.3-win64.exe）。
          Copy-Item "dist/扑克复盘台.exe" "dist/pokercoach-${{ github.ref_name }}-win64.exe"

      - name: 上传 exe
        uses: actions/upload-artifact@v5
        with:
          name: 扑克复盘台-Windows
          path: dist/pokercoach-${{ github.ref_name }}-win64.exe
          retention-days: 30

  # ── Mac 版 ─────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 装依赖
        run: pip install pyinstaller numpy

      - name: 构建二进制
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python -X utf8 build_app.py

      - name: 组装 .app（带图标）
        run: |
          APP="dist/扑克复盘台.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "dist/扑克复盘台" "$APP/Contents/MacOS/扑克复盘台"
          chmod +x "$APP/Contents/MacOS/扑克复盘台"
          if [ -f "app/扑克复盘台.app/Contents/Resources/applet.icns" ]; then
            cp "app/扑克复盘台.app/Contents/Resources/applet.icns" "$APP/Contents/Resources/icon.icns"
          fi
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>扑克复盘台</string>
            <key>CFBundleIdentifier</key><string>local.poker-coach.app</string>
            <key>CFBundleName</key><string>扑克复盘台</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          echo -n "APPL????" > "$APP/Contents/PkgInfo"
          codesign --force --deep --sign - "$APP" || true

      - name: 打 zip
        run: |
          cd dist
          zip -rq "pokercoach-${{ github.ref_name }}-mac.zip" "扑克复盘台.app"

      - name: 上传 zip
        uses: actions/upload-artifact@v5
        with:
          name: 扑克复盘台-Mac
          path: dist/pokercoach-${{ github.ref_name }}-mac.zip
          retention-days: 30

  # ── 发版时自动挂到 Releases ────────────────────────────
  release:
    needs: [windows, macos]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: 看下载到了什么
        run: find artifacts -type f | head -20
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/pokercoach-*-win64.exe
            artifacts/**/pokercoach-*-mac.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
